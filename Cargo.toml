[package]
name = "officelite"
version = "1.0.0"
edition = "2021"
description = "A small native macOS editor for Word and Excel files"
license = "ISC"
repository = "https://github.com/artcreator329/OfficeLite"

[dependencies]
wry = "0.47"
tao = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSURL", "NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSResponder",
    "NSSavePanel",
    "NSView",
    "NSWindow",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
